# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://github.com

name: Java CI with Maven and Docker

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

  workflow_dispatch:
    inputs:
      versao_jdk:
        description: 'Selecione a versão da JDK para rodar o Pipeline'
        required: true
        default: '21'
        type: choice
        options:
          - '11'
          - '17'
          - '21'

jobs:
  #-----------------------------
  # Etapa 1: build
  #------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up JDK ${{ github.event.inputs.versao_jdk || '21' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.versao_jdk || '21' }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build
        run: mvn -B clean compile

      - name: Upload dos arquivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: binnaries-and-target
          path: |
            target/
            pom.xml 

  # ----------------------------------------------------
  # ETAPA 2: TESTES (Só roda se o Build passar)
  # ----------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o JDK ${{ github.event.inputs.versao_jdk || '21' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.versao_jdk || '21' }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download dos arquivos compilados
        uses: actions/download-artifact@v4
        with:
          name: binnaries-and-target

      - name: Executar Testes
        run: mvn -B test

  # ----------------------------------------------------
  # ETAPA 3: EMPACOTAMENTO E DOCKER (Só roda se os Testes passarem)
  # ----------------------------------------------------
  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o JDK ${{ github.event.inputs.versao_jdk || '21' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.versao_jdk || '21' }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download dos arquivos compilados
        uses: actions/download-artifact@v4
        with:
          name: binnaries-and-target

      - name: Gerar JAR/WAR final
        run: mvn -B package -DskipTests --file pom.xml

      # NOVO: Realiza o login no Docker Hub usando seus Secrets
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # NOVO: Build e Push apontando para a pasta docker/
      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile # <-- CAMINHO ALTERADO PARA PROCURAR NA PASTA DOCKER
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/meu-app-java:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/meu-app-java:latest

      - name: Upload do Artefato Final (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
