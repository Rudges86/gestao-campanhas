# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

  # HABILITA O BOTÃO MANUAL COM ESCOLHA DE INPUT
  workflow_dispatch:
    inputs:
      versao_jdk:
        description: 'Selecione a versão da JDK para rodar o Pipeline'
        required: true
        default: '17'
        type: choice
        options:
          - '11'
          - '17'
          - '21'
jobs:
  #-----------------------------
  # Etapa 1: build
  #------------
  build:
    runs-on: ubuntu-latest
    steps:
    # 1→ Faz checkout do código do repositório
    - name: Checkout do código
      uses: actions/checkout@v4
    # 2→ Configura a jdk 
    - name: Set up JDK ${{ github.event.inputs.versao_jdk || '21' }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ github.event.inputs.versao_jdk || '21' }}
        distribution: 'temurin'
        cache: maven
        
    - name: Build
      run: mvn clean compile

        # Salva as classes compiladas para o próximo job usar
    - name: Upload dos arquivos compilados
      uses: actions/upload-artifact@v4
      with:
        name: binnaries-and-target
        path: |
                 target/
                 pom.xml 
      
    
      
  # ----------------------------------------------------
  # ETAPA 2: TESTES (Só roda se o Build passar)
  # ----------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: build # <-- ESTA LINHA CRIA A DEPENDÊNCIA
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o JDK ${{ github.event.inputs.versao_jdk || '21' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.versao_jdk || '21' }}
          distribution: 'temurin'
          cache: 'maven'

      # Baixa a pasta 'target' gerada no job anterior
      - name: Download dos arquivos compilados
        uses: actions/download-artifact@v4
        with:
          name: binnaries-and-target

      - name: Executar Testes
        run: mvn test

  # ----------------------------------------------------
  # ETAPA 3: EMPACOTAMENTO / DEPLOY (Só roda se os Testes passarem)
  # ----------------------------------------------------
  package:
    runs-on: ubuntu-latest
    needs: test # <-- Só roda se o job 'test' passar
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o JDK ${{ github.event.inputs.versao_jdk || '21' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.versao_jdk || '21' }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download dos arquivos compilados
        uses: actions/download-artifact@v4
        with:
          name: binnaries-and-target

      - name: Gerar JAR/WAR final
        run: mvn package -DskipTests # Pula testes aqui pois já rodaram antes

      # Opcional: Salva o JAR final gerado na aba "Artifacts" do GitHub actions
      - name: Upload do Artefato Final (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
