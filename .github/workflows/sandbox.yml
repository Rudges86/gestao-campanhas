name: Workflow Sandbox

# Deixa o workflow EXCLUSIVAMENTE manual
on:
  workflow_dispatch:
    inputs:
      versao_jdk:
        description: 'Selecione a versão da JDK'
        required: true
        default: '21'
        type: choice
        options:
          - '11'
          - '17'
          - '21'

jobs:
  # =========================================================================
  # ETAPA PRINCIPAL 1: CI E DOCKER (Contém as sub-etapas sequenciais)
  # =========================================================================
  build:
    runs-on: ubuntu-latest
    steps:
      # Sub-etapa 1: Faz checkout do código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # Sub-etapa 2: Configura a jdk
      - name: Set up JDK ${{ github.event.inputs.versao_jdk || '21' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.versao_jdk || '21' }}
          distribution: 'temurin'
          cache: 'maven'

      # Sub-etapa 3: Compila o projeto
      - name: Build (Compile)
        run: mvn -B clean compile --file pom.xml

      # Sub-etapa 4: Executa os Testes
      - name: Executar Testes
        run: mvn -B test --file pom.xml

      # Sub-etapa 5: Login no Docker Hub (Necessário antes de fazer o push)
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

          # Sub-etapa 6: Cria a imagem Docker e envia para o Docker Hub
      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/meu-app-java:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/meu-app-java:latest

      # Sub-etapa 7: Salva as classes compiladas para o próximo job usar
      - name: Upload dos arquivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: binnaries-and-target
          path: |
            target/
            pom.xml

  # =========================================================================
  # ETAPA PRINCIPAL 2: EMPACOTAMENTO (Só inicia quando a etapa anterior passa)
  # =========================================================================
  package:
    runs-on: ubuntu-latest
    needs: ci-and-docker # <-- Só roda se o bloco 'ci-and-docker' passar por completo
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o JDK ${{ github.event.inputs.versao_jdk || '21' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.versao_jdk || '21' }}
          distribution: 'temurin'
          cache: 'maven'

      # Baixa a pasta 'target' gerada no job anterior para não precisar compilar de novo
      - name: Download dos arquivos compilados
        uses: actions/download-artifact@v4
        with:
          name: binnaries-and-target

      - name: Gerar JAR/WAR final
        run: mvn -B package -DskipTests --file pom.xml # Pula testes aqui pois já rodaram antes

      # Salva o JAR final gerado na aba "Artifacts" do GitHub actions
      - name: Upload do Artefato Final (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
